[package]
name = "digidoc"
version = "0.2.0"
edition = "2024"
description = "A client library for BDOC/ASiC-E digital signatures (DigiDoc)"
license = "MIT"
repository = "https://github.com/wearekesk/digidoc-rs"
readme = "README.md"

[dependencies]
xml-sec = { version = "0.6.0", features = ["xmldsig"] }
roxmltree = "0.21.2"
x509-parser = "0.18.1"
zip = "9.7.0"
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
xml_serde = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1.44"
base64 = "0.23.1"
sha2 = "0.11.1"
sha1 = "0.11.0"
rsa = { version = "0.10.0", features = ["serde", "pkcs1v15"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
x509-cert = { version = "0.3.0", features = ["builder", "pem"] }
signature = "3.0.0"
